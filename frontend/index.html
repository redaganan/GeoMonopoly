<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <!-- Tailwind via CDN (fast dev) and Leaflet CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
:root{--cyber-dark:#0b0f1a;--neon-blue:#00f0ff;--neon-green:#39ff14;--neon-red:#ff2d95}html,body,#root{height:100%}body{background:radial-gradient(600px 300px at 10% 10%, rgba(0,240,255,0.04), transparent 10%), linear-gradient(180deg,#02040a 0%, #06101a 100%);color:white;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial;-webkit-font-smoothing:antialiased;background-color:var(--cyber-dark)}.hud{padding:.75rem;border-radius:.5rem;border:1px solid rgba(0,240,255,0.12);background:rgba(0,0,0,.4);font-size:.875rem}.glow{color:var(--neon-blue);text-shadow:0 0 8px rgba(0,240,255,.6)}.app-map{height:100vh;width:100%}
/* neon flash for polygon */
.leaflet-interactive.neon-flash{filter:drop-shadow(0 0 10px rgba(57,255,20,0.9)) drop-shadow(0 0 18px rgba(0,240,255,0.12));stroke-width:3.5 !important;animation:neonPulse 1s ease-in-out 2}
@keyframes neonPulse{0%{opacity:1}50%{opacity:0.35;transform:scale(1.01)}100%{opacity:1}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
